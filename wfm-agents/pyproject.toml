[project]
name = "wfm-agents"
version = "0.1.0"
description = "WFM Studio Agent Backend - FastAPI + (future) CrewAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "crewai>=1.14.2",
    "mcp>=1.26.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
# 预留给未来 AgenticX 官方 Python SDK；当前 in-tree 最小引擎无需安装额外包
agenticx = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wfm_agents"]

