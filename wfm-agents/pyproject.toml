[project]
name = "wfm-agents"
version = "0.3.0"
description = "WFM Studio MCP tools (stdio MCP server for Claude Code CLI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26.0",
    "ezdxf>=1.3",
    "python-docx>=1.1",
    "build123d>=0.10.0",
    "trimesh>=4.12.2",
    "shapely>=2.0",
    "openpyxl>=3.1",
    "python-pptx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wfm_agents"]

[tool.pytest.ini_options]
addopts = ["-m", "not integration"]
markers = [
    "integration: optional tests hitting real external APIs",
]

